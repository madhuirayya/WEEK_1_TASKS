<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task4_bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .container {
            width: 50%;
            font-family: Arial, Helvetica, sans-serif;
            border: 1px solid white;
            background-color: rgb(236, 241, 241);
        }

        .form-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <form class="row g-3 needs-validation" novalidate>
            <div class="mb-3">
                <label for="validationCustom01" class="form-label">First name</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="validationCustom01" required>
                    <div class="invalid-feedback">
                        Please supply your first name
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustom02" class="form-label">Last name</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="validationCustom02" required>
                    <div class="invalid-feedback">
                        Please supply your last name
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustomUsername" class="form-label">Email</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" id="validationCustomUsername" required>
                    <div class="invalid-feedback">
                        Please supply your email address
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustom03" class="form-label">Phone no</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                    <input type="text" class="form-control" id="validationCustom03" required>
                    <div class="invalid-feedback">
                        Please supply your phone number
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustom05" class="form-label">Address</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-house-fill"></i></span>
                    <input type="text" class="form-control" id="validationCustom05" required>
                    <div class="invalid-feedback">
                        Please supply your street address
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustom06" class="form-label">City</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                    <input type="text" class="form-control" id="validationCustom06" required>
                    <div class="invalid-feedback">
                        Please supply your city
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="validationCustom04" class="form-label">State</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-list-ul"></i></span>
                    <select class="form-select" id="validationCustom04" required>
                        <option selected disabled value="">Please select an option</option>
                        <option>Karnataka</option>
                        <option>Kerala</option>
                        <option>Tamil Nadu</option>
                        <option>Andhra Pradesh</option>
                    </select>
                    <div class="invalid-feedback">
                        Please select a valid state.
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Do you have hosting?</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="hosting" id="hostingYes" value="yes">
                    <label class="form-check-label" for="hostingYes">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="hosting" id="hostingNo" value="no">
                    <label class="form-check-label" for="hostingNo">No</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="projectDescription" class="form-label">Project Description</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-pencil-fill"></i></span>
                    <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                </div>
            </div>

            <button class="btn btn-warning" type="submit">
                <i class="bi bi-send-fill me-1"></i> Send
            </button>


        </form>
    </div>
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
