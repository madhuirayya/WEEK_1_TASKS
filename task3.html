<<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        h2 {
            text-align: center;
            color: blue;
            font-size: 28px;
        }
        table {
            width: 60%;
            margin: 0 auto;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            padding: 5px;
            vertical-align: top;
        }
        input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        .center {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>Registration form</h2>

<form>
    <table>
        <tr>
            <td><b>First Name</b></td>
            <td><input type="text" name="firstname"></td>
        </tr>
        <tr>
            <td><b>Last Name</b></td>
            <td><input type="text" name="lastname"></td>
        </tr>
        <tr>
            <td><b>Email</b></td>
            <td><input type="email" name="email"></td>
        </tr>
        <tr>
            <td><b>Password</b></td>
            <td><input type="password" name="password"></td>
        </tr>
        <tr>
            <td><b>Re-enter Password</b></td>
            <td><input type="password" name="repassword"></td>
        </tr>
        <tr>
            <td><b>Gender:</b></td>
            <td>
                <input type="radio" name="gender" value="male"> Male<br>
                <input type="radio" name="gender" value="female"> Female
            </td>
        </tr>
        <tr>
            <td><b>Age:</b></td>
            <td><input type="number" name="age"></td>
        </tr>
        <tr>
            <td><b>Phone Number</b></td>
            <td><input type="text" name="phone"></td>
        </tr>
        <tr>
            <td><b>Address</b></td>
            <td><textarea name="address" rows="4"></textarea></td>
        </tr>
        <tr>
            <td><b>State</b></td>
            <td><input type="text" name="state"></td>
        </tr>
        <tr>
            <td><b>Country</b></td>
            <td>
                <select name="country">
                    <option>Choose your country</option>
                    <option>India</option>
                    <option>USA</option>
                    <option>UK</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><b>Languages known</b></td>
            <td>
                <input type="checkbox" name="lang" value="english"> English
                <input type="checkbox" name="lang" value="kannada"> Kannada
                <input type="checkbox" name="lang" value="hindi"> Hindi
                <input type="checkbox" name="lang" value="telugu"> Telugu
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="checkbox" name="declare" checked>
                Hereby I declare all the given details are true
                <span style="float: right;">
                    <a href="#">Log in to <span style="color:purple;">Acharya</span> website</a>
                </span>
            </td>
        </tr>
    </table>

    <div class="center">
        <input type="submit" value="Register">
    </div>
</form>

</body>
</html>
