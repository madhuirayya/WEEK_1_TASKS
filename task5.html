<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bars</title>
    <style>
        body {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        /* Vertical Navigation */
        .vertical-nav-container {
            background-color: orange;
            padding: 10px;
        }

        .vertical-nav {
            width: 150px;
            border: 1px solid black;
        }

        .vertical-nav a {
            display: block;
            color: blue;
            padding: 10px;
            text-decoration: none;
        }

        .vertical-nav a:first-child {
            background-color: orange;
            color: white;
            font-weight: bold;
        }

        .vertical-nav a:not(:first-child) {
            background-color: lightblue;
        }

        /* Horizontal Navigation */
        .horizontal-nav-container {
            text-align: center;
        }

        .horizontal-nav {
            display: flex;
            border: 1px solid black;
            width: fit-content;
            margin: 0 auto;
        }

        .horizontal-nav a {
            padding: 10px 20px;
            border-right: 1px solid blue;
            text-decoration: none;
            color: blue;
        }

        .horizontal-nav a:first-child {
            background-color: grey;
            color: white;
            font-weight: bold;
        }

        .horizontal-nav a:last-child {
            border-right: none;
        }

        h3 {
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Vertical Navigation Bar -->
    <div>
        <h3>Vertical Navigation Bar</h3>
        <div class="vertical-nav-container">
            <div class="vertical-nav">
                <a href="#">Home</a>
                <a href="#">Java</a>
                <a href="#">CSS</a>
                <a href="#">HTML</a>
                <a href="#">Bootstrap</a>
            </div>
        </div>
    </div>

    <!-- Horizontal Navigation Bar -->
    <div>
        <h3>Horizontal Navigation Bar</h3>
        <div class="horizontal-nav">
            <a href="#">Home</a>
            <a href="#">Java</a>
            <a href="#">HTML</a>
            <a href="#">CSS</a>
        </div>
    </div>

</body>
</html>
